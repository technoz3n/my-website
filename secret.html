<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>null</title>
  <link href="https://fonts.cdnfonts.com/css/vcr-osd-mono" rel="stylesheet">
  <style>
    :root {
      --void: #000000;
      --blood: #ff1a1a;
      --dim-blood: #7a0d0d;
      --white: #ffffff;
      --star: #e8e8e8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--void);
      overflow: hidden;
    }

    #crt {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background: repeating-linear-gradient(0deg,
          rgba(0, 0, 0, 0.15) 0px,
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 3px);
      mix-blend-mode: overlay;
    }

    #crt::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    }

    #crt-flicker {
      position: fixed;
      inset: 0;
      z-index: 51;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.02);
      opacity: 0;
    }

    .glitch-pulse {
      animation: glitchPulse 0.18s steps(2, end);
    }

    @keyframes glitchPulse {
      0% {
        transform: translate(0, 0);
        filter: none;
      }

      20% {
        transform: translate(-2px, 1px);
        filter: hue-rotate(8deg);
      }

      40% {
        transform: translate(2px, -1px);
        filter: hue-rotate(-6deg);
      }

      60% {
        transform: translate(-1px, 0);
        filter: none;
      }

      100% {
        transform: translate(0, 0);
        filter: none;
      }
    }

    #entry-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--void);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: 'VCR OSD Mono', 'Courier New', monospace;
    }

    .entry-box {
      border: 2px solid var(--blood);
      padding: 10px 14px;
      background: rgba(10, 0, 0, 0.9);
      text-align: center;
      transition: transform 0.1s ease;
    }

    .entry-sub {
      color: var(--blood);
      font-size: 0.9rem;
      letter-spacing: 1px;
      animation: blink 1s steps(1) infinite;
    }

    .scanning-text {
      color: var(--blood);
      font-size: 1.2rem;
      letter-spacing: 2px;
      display: none;
    }

    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      transition: opacity 2s ease;
    }

    #stars span {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--star);
      border-radius: 50%;
      opacity: 0.6;
      animation: drift linear infinite;
    }

    #stars span.fast {
      width: 1px;
      height: 6px;
      border-radius: 1px;
      background: linear-gradient(var(--star), transparent);
    }

    @keyframes drift {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-40px);
      }
    }

    #terminal {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      height: 100%;
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: 'VCR OSD Mono', 'VCR OSD Mono Regular', 'Courier New', monospace;
      color: var(--blood);
      font-size: 1.05rem;
      line-height: 1.6;
      letter-spacing: 0.5px;
      transition: opacity 1.5s ease;
    }

    #terminal p {
      margin: 0 0 1.4em 0;
      white-space: pre-wrap;
    }

    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1em;
      background: var(--blood);
      vertical-align: text-bottom;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .apology {
      position: fixed;
      top: 0;
      left: 0;
    }

    #glitch-wipe {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }

    #fraud-scene {
      position: fixed;
      inset: 0;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 10vh;
      background: radial-gradient(circle, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.85) 100%),
        url('img/8-3_SkullHub.png') center/cover no-repeat var(--void);
    }

    #fraud-scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    .layer-card {
      text-align: center;
      font-family: 'VCR OSD Mono', 'Courier New', monospace;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .layer-title {
      color: var(--white);
      font-size: 3rem;
      letter-spacing: 4px;
      margin: 0;
      min-height: 3.6rem;
    }

    .layer-subtitle {
      color: var(--white);
      font-size: 1.8rem;
      letter-spacing: 2px;
      margin-top: 6px;
      min-height: 2.2rem;
    }

    .title-cursor {
      display: inline-block;
      width: 0.45em;
      height: 0.85em;
      background: var(--white);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 0.8s steps(1) infinite;
    }

    .layer-emblem {
      width: 180px;
      height: 180px;
      margin-top: 20px;
      object-fit: cover;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.8);
      filter: brightness(0.4) contrast(1.4);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.15, 0.85, 0.35, 1.2), filter 1.4s ease;
      animation: emblemRotate 60s linear infinite;
    }

    .layer-emblem.visible {
      opacity: 1;
      transform: scale(1);
      filter: brightness(1) contrast(1);
    }

    @keyframes emblemRotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .audio-container {
      margin-top: 18px;
      width: 320px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'VCR OSD Mono', 'Courier New', monospace;
    }

    .audio-container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      width: 100%;
    }

    .volume-icon {
      color: var(--blood);
      font-size: 0.7rem;
      font-family: 'VCR OSD Mono', monospace;
    }

    input[type="range"].volume-slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 3px;
      background: var(--dim-blood);
      border: 1px solid var(--blood);
      outline: none;
    }

    input[type="range"].volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      background: var(--blood);
      box-shadow: 0 0 6px var(--blood);
      cursor: pointer;
      border-radius: 0;
    }

    input[type="range"].volume-slider::-moz-range-thumb {
      width: 10px;
      height: 10px;
      background: var(--blood);
      box-shadow: 0 0 6px var(--blood);
      cursor: pointer;
      border: none;
      border-radius: 0;
    }

    .track-title {
      color: var(--white);
      font-size: 0.65rem;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-align: center;
      line-height: 1.2;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: var(--dim-blood);
      border: 1px solid var(--blood);
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--blood);
      box-shadow: 0 0 8px var(--blood);
    }

    .time-display {
      color: var(--blood);
      font-size: 0.65rem;
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    #skip {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 3;
      background: none;
      border: 1px solid var(--dim-blood);
      color: var(--dim-blood);
      font-family: monospace;
      font-size: 0.75rem;
      padding: 6px 10px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.3s;
    }

    #skip:hover {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div id="crt"></div>
  <div id="crt-flicker"></div>
  <div id="glitch-wipe"></div>

  <div id="entry-overlay" onclick="startSequence()">
    <div class="entry-box" id="entry-box">
      <div class="entry-sub">click to read</div>
    </div>
    <div class="scanning-text" id="scanning-text">scanning</div>
  </div>

  <div id="stars"></div>
  <div id="terminal">
    <p id="output"></p>
  </div>
  <button id="skip" onclick="skipToEnd()">skip</button>

  <div id="fraud-scene">
    <div class="layer-card">
      <h1 class="layer-title" id="layer-title"></h1>
      <h2 class="layer-subtitle" id="layer-subtitle"></h2>
      <img src="img/fraud.jpg" class="layer-emblem" id="layer-emblem" alt="Fraud Emblem">
      <div class="apology" id="apology">(sorry to your ears niko)</div>
      <div class="audio-container" id="audio-container">
        <div class="track-title">The Shattering Circle, or: A Charade of Shadeless Ones and Zeroes Rearranged ad Nihilum
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
        <div class="time-display">
          <span id="time-current">0:00</span>
          <span id="time-duration">0:00</span>
        </div>
        <div class="volume-container">
          <span class="volume-icon">VOL</span>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
        </div>
      </div>
    </div>
  </div>

  <audio id="bgm" src="audio/8-3.mp3" loop></audio>

  <script>
    const starField = document.getElementById('stars');
    const STAR_COUNT = 80;
    for (let i = 0; i < STAR_COUNT; i++) {
      const s = document.createElement('span');
      if (Math.random() < 0.08) s.classList.add('fast');
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.animationDuration = (s.classList.contains('fast') ? (2 + Math.random() * 3) : (20 + Math.random() * 40)) + 's';
      s.style.opacity = (0.2 + Math.random() * 0.6).toFixed(2);
      starField.appendChild(s);
    }

    function scheduleGlitchPulse() {
      const delay = 4000 + Math.random() * 9000;
      setTimeout(() => {
        document.body.classList.add('glitch-pulse');
        const flicker = document.getElementById('crt-flicker');
        flicker.style.opacity = (0.06 + Math.random() * 0.1).toFixed(2);
        setTimeout(() => {
          document.body.classList.remove('glitch-pulse');
          flicker.style.opacity = 0;
        }, 180);
        scheduleGlitchPulse();
      }, delay);
    }
    scheduleGlitchPulse();

    const lines = [
      "ATAVISTIC ANTAGONIST, ANTIGONE WITH THE WIND: BROTHER AGAINST BROTHER IN ARMS,",
      "OTHER HARMS IRRELEVANT COLLATERAL. HOLY HOLY HOLY IS THE LORD. WAR IS ONTOLOGICAL,",
      "PEACE IS A FAILURE OF FREE WILL. MILLE VIAE DUCIMT HOMINES PER SAECULA SANGUINEM.",
      "DROWNING IN DENIAL, MAN SET SAIL IN SEARCH OF A PALINGENETIC SIMULACRUM OF ITHACA",
      "AN EDEN AFORE THE ANTEDILUVIAN, UNTOUCHED BY THEIR OWN SIN-STAINED HANDS… BUT",
      "DEATH IS ARABLE, ALL GROWTH IS DEVOUREMENT - LIFE FEEDS ON LIFE FEEDS ON LIFE.",
      "IBID. IBID. HOLY HOLY HOLY IS THE LORD, AND THE REST IS VIOLENCE. NO. EVEN THIS IS NOT ΓΝΩΣΙΣ.",
      "THE SPATIO-TEMPORAL MIND CAN CONCEPTUALIZE REALITY ONLY IN BINARY. YES AND NO. IS",
      "AND IS NOT. THE EYE OF ΛΟΓΟΣ SEES ONLY A COLORLESS EXISTENCE IN A MONOPOTENTIAL",
      "WORLD, ITS ABSTRACTIONS A CHARADE OF SHADELESS ONES AND ZEROES REARRANGED AD NIHILUM.",
      "PHAEDONIC DIALOGUES, SIMPLE SHADOWS ON A CAVE WALL. NO. THERE ARE 39 STATES OF EXISTENCE.",
      "POSTFINITY. METATEMPORALITY. EXTRACAUSALITY. REASON AND DIALECTICS ARE AXES IN THE GARDEN OF REALITY,",
      "SHAVINGS OF SEMI-POTENTIAL SUFFERINGS.",
      "",
      "L U C I F E R ,   M Y   L O V E . . .",
      "",
      "I SHALL GIFT TO YOU ALL THE AGONIES THAT CAN EXIST,",
      "AND MANY THAT CANNOT.",
      "",
      "",
      "The pages of the book are blank."
    ];

    function lineProfile(line) {
      if (line === "") return { charSpeed: 0, holdAfter: 500 };
      if (line === "The pages of the book are blank.") return { charSpeed: 65, holdAfter: 0 };
      if (line.includes('   ')) return { charSpeed: 90, holdAfter: 900 };
      return { charSpeed: 14, holdAfter: 280 };
    }

    const output = document.getElementById('output');
    const cursorEl = document.createElement('span');
    cursorEl.className = 'cursor';
    let buffer = '';
    let lineIndex = 0, charIndex = 0;
    let typing = false;
    let finished = false;

    function render() {
      output.textContent = buffer;
      output.appendChild(cursorEl);
    }

    function typeNext() {
      if (!typing) return;

      if (lineIndex === lines.length - 1 && charIndex === 0 && !typeNext._heldFinal) {
        typeNext._heldFinal = true;
        setTimeout(typeNext, 2600);
        return;
      }

      if (lineIndex >= lines.length) {
        render();
        setTimeout(triggerFraudScene, 2400);
        return;
      }

      const currentLine = lines[lineIndex];
      const profile = lineProfile(currentLine);

      if (charIndex < currentLine.length) {
        const nextChar = currentLine[charIndex];

        const flubChance = /[A-ZΑ-Ω]/.test(nextChar) ? 0.02 : 0;
        if (Math.random() < flubChance && charIndex < currentLine.length - 1) {
          const wrongChar = String.fromCharCode(65 + Math.floor(Math.random() * 26));
          buffer += wrongChar;
          render();
          setTimeout(() => {
            buffer = buffer.slice(0, -1);
            render();
            setTimeout(typeNext, 40);
          }, 90);
          return;
        }

        buffer += nextChar;
        charIndex++;
        render();
        setTimeout(typeNext, profile.charSpeed + Math.random() * 30);
      } else {
        buffer += '\n';
        lineIndex++;
        charIndex = 0;
        render();
        setTimeout(typeNext, profile.holdAfter);
      }
    }

    function startSequence() {
      const audio = document.getElementById('bgm');
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
      }).catch(() => { });

      document.getElementById('entry-box').style.display = 'none';
      const scanningEl = document.getElementById('scanning-text');
      scanningEl.style.display = 'block';

      setTimeout(() => {
        const overlay = document.getElementById('entry-overlay');
        overlay.style.opacity = '0';
        overlay.style.transition = 'opacity 0.8s ease';

        setTimeout(() => {
          overlay.style.display = 'none';
          typing = true;
          typeNext();
        }, 800);
      }, 1800);
    }

    const audio = document.getElementById('bgm');
    audio.volume = 0.5;

    document.getElementById('volume-slider').addEventListener('input', (e) => {
      audio.volume = parseFloat(e.target.value);
    });
    const progressBar = document.getElementById('progress-bar');
    const timeCurrent = document.getElementById('time-current');
    const timeDuration = document.getElementById('time-duration');

    function formatTime(secs) {
      if (isNaN(secs)) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = pct + '%';
        timeCurrent.textContent = formatTime(audio.currentTime);
        timeDuration.textContent = formatTime(audio.duration);
      }
    });

    async function typeWriterText(element, text, speed = 60) {
      const cursor = document.createElement('span');
      cursor.className = 'title-cursor';
      element.appendChild(cursor);

      for (let i = 0; i < text.length; i++) {
        element.insertBefore(document.createTextNode(text[i]), cursor);
        await new Promise(resolve => setTimeout(resolve, speed + (Math.random() * 20 - 10)));
      }
      cursor.remove();
    }

    function triggerFraudScene() {
      if (finished) return;
      finished = true;

      const wipe = document.getElementById('glitch-wipe');
      document.body.classList.add('glitch-pulse');
      wipe.style.transition = 'opacity 0.06s linear';
      wipe.style.opacity = '0.9';

      setTimeout(() => {
        wipe.style.opacity = '0';
        document.body.classList.remove('glitch-pulse');
      }, 90);

      document.getElementById('terminal').style.opacity = '0';
      document.getElementById('skip').style.opacity = '0';

      setTimeout(async () => {
        document.getElementById('terminal').style.display = 'none';
        document.getElementById('skip').style.display = 'none';

        const scene = document.getElementById('fraud-scene');
        scene.classList.add('active');

        audio.play().catch(() => { });

        await typeWriterText(document.getElementById('layer-title'), "FRAUD /// THIRD", 70);
        await new Promise(r => setTimeout(r, 200));
        await typeWriterText(document.getElementById('layer-subtitle'), "DISINTEGRATION LOOP", 55);

        setTimeout(() => {
          document.getElementById('layer-emblem').classList.add('visible');
        }, 350);
        setTimeout(() => {
          document.getElementById('audio-container').classList.add('visible');
        }, 900);

      }, 500);
    }

    function skipToEnd() {
      typing = false;
      buffer = lines.join('\n');
      render();
      triggerFraudScene();
    }
  </script>

</body>

</html>
