<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>null</title>
<link href="https://fonts.cdnfonts.com/css/vcr-osd-mono" rel="stylesheet">
<style>
  :root {
    --void: #000000;
    --blood: #ff1a1a;
    --dim-blood: #7a0d0d;
    --white: #ffffff;
    --star: #e8e8e8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--void);
    overflow: hidden;
  }

  /* --- ENTRY / SCANNING OVERLAY --- */
  #entry-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--void);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: 'VCR OSD Mono', 'Courier New', monospace;
  }

  .entry-box {
    border: 2px solid var(--blood);
    padding: 24px 36px;
    background: rgba(10, 0, 0, 0.9);
    box-shadow: 0 0 20px rgba(255, 26, 26, 0.4);
    text-align: center;
    transition: transform 0.1s ease;
  }

  .entry-box:hover {
    transform: scale(1.02);
  }

  .entry-title {
    color: var(--white);
    font-size: 1.2rem;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  .entry-sub {
    color: var(--blood);
    font-size: 0.9rem;
    letter-spacing: 1px;
    animation: blink 1s steps(1) infinite;
  }

  .scanning-text {
    color: var(--blood);
    font-size: 1.2rem;
    letter-spacing: 2px;
    display: none;
  }

  /* --- BACKGROUND STARS --- */
  #stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    transition: opacity 2s ease;
  }

  #stars span {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--star);
    border-radius: 50%;
    opacity: 0.6;
    animation: drift linear infinite;
  }

  @keyframes drift {
    from { transform: translateY(0); }
    to   { transform: translateY(-40px); }
  }

  /* --- TERMINAL LOG --- */
  #terminal {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    height: 100%;
    padding: 48px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-family: 'VCR OSD Mono', 'VCR OSD Mono Regular', 'Courier New', monospace;
    color: var(--blood);
    font-size: 1.05rem;
    line-height: 1.6;
    letter-spacing: 0.5px;
    transition: opacity 1.5s ease;
  }

  #terminal p {
    margin: 0 0 1.4em 0;
    white-space: pre-wrap;
  }

  .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--blood);
    vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  /* --- 8-3 FRAUD SCENE --- */
  .apology {
  position: fixed;
  top: 0;
  left: 0;
}
  #fraud-scene {
    position: fixed;
    inset: 0;
    z-index: 2;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2.5s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 10vh;
    background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 100%), 
                url('8-3_SkullHub.png') center/cover no-repeat var(--void);
  }

  #fraud-scene.active {
    opacity: 1;
    pointer-events: auto;
  }

  .layer-card {
    text-align: center;
    font-family: 'VCR OSD Mono', 'Courier New', monospace;
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .layer-title {
    color: var(--white);
    font-size: 3rem;
    letter-spacing: 4px;
    margin: 0;
    min-height: 3.6rem;
  }

  .layer-subtitle {
    color: var(--white);
    font-size: 1.8rem;
    letter-spacing: 2px;
    margin-top: 6px;
    min-height: 2.2rem;
  }

  .title-cursor {
    display: inline-block;
    width: 0.45em;
    height: 0.85em;
    background: var(--white);
    margin-left: 4px;
    vertical-align: middle;
    animation: blink 0.8s steps(1) infinite;
  }

  .layer-emblem {
    width: 180px;
    height: 180px;
    margin-top: 20px;
    object-fit: cover;
    border-radius: 50%;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.15, 0.85, 0.35, 1.2);
    animation: emblemRotate 60s linear infinite;
  }

  .layer-emblem.visible {
    opacity: 1;
    transform: scale(1);
  }

  @keyframes emblemRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* --- AUDIO TRACK BAR --- */
  .audio-container {
    margin-top: 18px;
    width: 320px;
    opacity: 0;
    transition: opacity 1.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'VCR OSD Mono', 'Courier New', monospace;
  }

  .audio-container.visible {
    opacity: 1;
  }
    .volume-container {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    width: 100%;
  }

  .volume-icon {
    color: var(--blood);
    font-size: 0.7rem;
    font-family: 'VCR OSD Mono', monospace;
  }

  input[type="range"].volume-slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 3px;
    background: var(--dim-blood);
    border: 1px solid var(--blood);
    outline: none;
  }

  input[type="range"].volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    background: var(--blood);
    box-shadow: 0 0 6px var(--blood);
    cursor: pointer;
    border-radius: 0;
  }

  input[type="range"].volume-slider::-moz-range-thumb {
    width: 10px;
    height: 10px;
    background: var(--blood);
    box-shadow: 0 0 6px var(--blood);
    cursor: pointer;
    border: none;
    border-radius: 0;
  }

  .track-title {
    color: var(--white);
    font-size: 0.65rem;
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-align: center;
    line-height: 1.2;
  }

  .progress-bar-bg {
    width: 100%;
    height: 4px;
    background: var(--dim-blood);
    border: 1px solid var(--blood);
    position: relative;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--blood);
    box-shadow: 0 0 8px var(--blood);
  }

  .time-display {
    color: var(--blood);
    font-size: 0.65rem;
    margin-top: 4px;
    display: flex;
    justify-content: space-between;
    width: 100%;
  }

  #skip {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 3;
    background: none;
    border: 1px solid var(--dim-blood);
    color: var(--dim-blood);
    font-family: monospace;
    font-size: 0.75rem;
    padding: 6px 10px;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.3s;
  }
  #skip:hover { opacity: 1; }
</style>
</head>
<body>

<div id="entry-overlay" onclick="startSequence()">
  <div class="entry-box" id="entry-box">
    <div class="entry-title">ENTRY FOUND</div>
    <div class="entry-sub">[ CLICK TO READ ]</div>
  </div>
  <div class="scanning-text" id="scanning-text">TEXT SCANNING<span id="dots">...</span></div>
</div>

<div id="stars"></div>
<div id="terminal"><p id="output"></p></div>
<button id="skip" onclick="skipToEnd()">skip</button>

<div id="fraud-scene">
  <div class="layer-card">
    <h1 class="layer-title" id="layer-title"></h1>
    <h2 class="layer-subtitle" id="layer-subtitle"></h2>
    <img src="fraud.jpg" class="layer-emblem" id="layer-emblem" alt="Fraud Emblem">
    <div class="apology" id="apology">(sorry to your ears niko)</div>
    <div class="audio-container" id="audio-container">
      <div class="track-title">The Shattering Circle, or: A Charade of Shadeless Ones and Zeroes Rearranged ad Nihilum</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
      <div class="time-display">
        <span id="time-current">0:00</span>
        <span id="time-duration">0:00</span>
      </div>
            <div class="volume-container">
        <span class="volume-icon">VOL</span>
        <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
      </div>
    </div>
  </div>
</div>

<audio id="bgm" src="8-3.wav" loop></audio>

<script>
  // starfield initialization
  const starField = document.getElementById('stars');
  const STAR_COUNT = 80;
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDuration = (20 + Math.random() * 40) + 's';
    s.style.opacity = (0.2 + Math.random() * 0.6).toFixed(2);
    starField.appendChild(s);
  }

  const lines = [
    "ATAVISTIC ANTAGONIST, ANTIGONE WITH THE WIND: BROTHER AGAINST BROTHER IN ARMS,",
    "OTHER HARMS IRRELEVANT COLLATERAL. HOLY HOLY HOLY IS THE LORD. WAR IS ONTOLOGICAL,",
    "PEACE IS A FAILURE OF FREE WILL. MILLE VIAE DUCIMT HOMINES PER SAECULA SANGUINEM.",
    "DROWNING IN DENIAL, MAN SET SAIL IN SEARCH OF A PALINGENETIC SIMULACRUM OF ITHACA",
    "AN EDEN AFORE THE ANTEDILUVIAN, UNTOUCHED BY THEIR OWN SIN-STAINED HANDS… BUT",
    "DEATH IS ARABLE, ALL GROWTH IS DEVOUREMENT - LIFE FEEDS ON LIFE FEEDS ON LIFE.",
    "IBID. IBID. HOLY HOLY HOLY IS THE LORD, AND THE REST IS VIOLENCE. NO. EVEN THIS IS NOT ΓΝΩΣΙΣ.",
    "THE SPATIO-TEMPORAL MIND CAN CONCEPTUALIZE REALITY ONLY IN BINARY. YES AND NO. IS",
    "AND IS NOT. THE EYE OF ΛΟΓΟΣ SEES ONLY A COLORLESS EXISTENCE IN A MONOPOTENTIAL",
    "WORLD, ITS ABSTRACTIONS A CHARADE OF SHADELESS ONES AND ZEROES REARRANGED AD NIHILUM.",
    "PHAEDONIC DIALOGUES, SIMPLE SHADOWS ON A CAVE WALL. NO. THERE ARE 39 STATES OF EXISTENCE.",
    "POSTFINITY. METATEMPORALITY. EXTRACAUSALITY. REASON AND DIALECTICS ARE AXES IN THE GARDEN OF REALITY,",
    "SHAVINGS OF SEMI-POTENTIAL SUFFERINGS.",
    "",
    "L U C I F E R ,   M Y   L O V E . . .",
    "",
    "I SHALL GIFT TO YOU ALL THE AGONIES THAT CAN EXIST,",
    "AND MANY THAT CANNOT.",
    "",
    "",
    "The pages of the book are blank."
  ];

  const output = document.getElementById('output');
  const cursorEl = document.createElement('span');
  cursorEl.className = 'cursor';
  let buffer = '';
  let lineIndex = 0, charIndex = 0;
  let typing = false;
  let finished = false;

  function render() {
    output.textContent = buffer;
    output.appendChild(cursorEl);
  }

  function typeNext() {
    if (!typing) return;
    if (lineIndex >= lines.length) {
      render();
      setTimeout(triggerFraudScene, 2000);
      return;
    }
    const currentLine = lines[lineIndex];
    if (charIndex < currentLine.length) {
      buffer += currentLine[charIndex];
      charIndex++;
      render();
      setTimeout(typeNext, 18 + Math.random() * 35);
    } else {
      buffer += '\n';
      lineIndex++;
      charIndex = 0;
      render();
      setTimeout(typeNext, currentLine === "" ? 100 : 350);
    }
  }

  function startSequence() {
    const audio = document.getElementById('bgm');
    audio.play().then(() => {
      audio.pause();
      audio.currentTime = 0;
    }).catch(() => {});

    document.getElementById('entry-box').style.display = 'none';
    const scanningEl = document.getElementById('scanning-text');
    scanningEl.style.display = 'block';

    let dotCount = 0;
    const dotInterval = setInterval(() => {
      dotCount = (dotCount + 1) % 4;
      document.getElementById('dots').textContent = '.'.repeat(dotCount);
    }, 250);

    setTimeout(() => {
      clearInterval(dotInterval);
      const overlay = document.getElementById('entry-overlay');
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity 0.8s ease';
      
      setTimeout(() => {
        overlay.style.display = 'none';
        typing = true;
        typeNext();
      }, 800);
    }, 1800);
  }

  // --- AUDIO PROGRESS TRACKING ---
  const audio = document.getElementById('bgm');
    audio.volume = 0.5; // sane default instead of blasting at 1.0

  document.getElementById('volume-slider').addEventListener('input', (e) => {
    audio.volume = parseFloat(e.target.value);
  });
  const progressBar = document.getElementById('progress-bar');
  const timeCurrent = document.getElementById('time-current');
  const timeDuration = document.getElementById('time-duration');

  function formatTime(secs) {
    if (isNaN(secs)) return "0:00";
    const m = Math.floor(secs / 60);
    const s = Math.floor(secs % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      const pct = (audio.currentTime / audio.duration) * 100;
      progressBar.style.width = pct + '%';
      timeCurrent.textContent = formatTime(audio.currentTime);
      timeDuration.textContent = formatTime(audio.duration);
    }
  });

  // --- FRAUD SCENE TYPEWRITER ---
  async function typeWriterText(element, text, speed = 60) {
    const cursor = document.createElement('span');
    cursor.className = 'title-cursor';
    element.appendChild(cursor);

    for (let i = 0; i < text.length; i++) {
      element.insertBefore(document.createTextNode(text[i]), cursor);
      await new Promise(resolve => setTimeout(resolve, speed + (Math.random() * 20 - 10)));
    }
    cursor.remove();
  }

  function triggerFraudScene() {
    if (finished) return;
    finished = true;

    document.getElementById('terminal').style.opacity = '0';
    document.getElementById('skip').style.opacity = '0';
    
    setTimeout(async () => {
      document.getElementById('terminal').style.display = 'none';
      document.getElementById('skip').style.display = 'none';
      
      const scene = document.getElementById('fraud-scene');
      scene.classList.add('active');

      audio.play().catch(() => {});

      // Type title, then subtitle, then unveil emblem + audio bar
      await typeWriterText(document.getElementById('layer-title'), "FRAUD /// THIRD", 70);
      await new Promise(r => setTimeout(r, 200));
      await typeWriterText(document.getElementById('layer-subtitle'), "DISINTEGRATION LOOP", 55);
      
      setTimeout(() => {
        document.getElementById('layer-emblem').classList.add('visible');
        document.getElementById('audio-container').classList.add('visible');
      }, 300);

    }, 1500);
  }

  function skipToEnd() {
    typing = false;
    buffer = lines.join('\n');
    render();
    triggerFraudScene();
  }
</script>

</body>
</html>
