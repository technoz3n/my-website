<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — segfault</title>
    <script src="https://louisabraham.github.io/nekojs/neko.js" data-autostart></script>
    <link rel="icon" type="image/png" href="theworldmachine.png" sizes="96x96">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <script src="site.js" defer></script>
</head>

<body>

    <div id="websiteContainer">
        <div class="titlebar">
            <div class="window-dots">
                <span class="dot-close"></span>
                <span class="dot-min"></span>
                <span class="dot-max"></span>
            </div>
            <span class="titlebar-label">technoz3n@worldmachine:~$ ./find-page.sh</span>
            <nav class="view-switcher">
                <a href="index.html" class="nav-item">about</a>
                <a href="projects.html" class="nav-item">projects</a>
                <a href="socials.html" class="nav-item">socials</a>
            </nav>
        </div>

        <main class="content-layout full-width">
            <div class="column-main">
                <section class="adw-card crash-card">
                    <div class="crash-glyph" aria-hidden="true">
                        <span>404</span>
                        <span>404</span>
                        <span>404</span>
                    </div>

                    <div class="fetch-data crash-log">
                        <div>HA! you really think youd find something interesting here!? think again, jackass! youre an idiot /s</div>
                    </div>

                    <hr class="card-divider">

                    <div class="crash-actions">
                        <a href="index.html" class="pill-action">force quit → back to desktop</a>
                        <button class="pill-action pill-ghost" onclick="history.back()">restart previous window</button>
                    </div>
                </section>
            </div>
        </main>

        <footer class="taskbar">
            <span class="taskbar-clock" id="taskbar-clock">--:--:--</span>
            <span>1 window not responding</span>
        </footer>
    </div>

    <script>
        document.getElementById('crash-path').textContent = window.location.pathname;
    </script>
</body>

</html>
