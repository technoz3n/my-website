<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #050507;
            --accent: #00a6d8;
            --accent-dim: rgba(0, 166, 216, 0.2);
            --border: #2a2228;
            --text-main: #d4ceb8;
            --text-dim: #8a8578;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-mono);
            overflow: hidden;
            user-select: none;
        }

        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        #splash {
            position: absolute;
            inset: 0;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        #splash.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--text-main);
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .splash-sub {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 2px;
            border: 1px solid var(--border);
            padding: 8px 16px;
            background: #0d0d11;
        }

        .splash-sub:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: linear-gradient(transparent, rgba(5, 5, 7, 0.95));
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .player-container:hover .controls-overlay {
            opacity: 1;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: var(--border);
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
        }

        .left-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-ctrl {
            background: #0d0d11;
            border: 1px solid var(--border);
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 6px 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-ctrl:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        .time-display {
            color: var(--text-dim);
        }

        .watermark {
            position: absolute;
            top: 20px;
            left: 24px;
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 1px;
            pointer-events: none;
            opacity: 0.5;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="splash" onclick="enterExperience()">
        <div></div>
    </div>
    <div class="player-container">
        <div class="watermark">TOOL // AENEMA</div>

        <video id="main-video" src="https://cdn.technoz3n.vexr.dev/media/aenema.webm" playsinline></video>

        <div class="controls-overlay">
            <div class="progress-bar-container" id="progress-container" onclick="seekVideo(event)">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="control-row">
                <div class="left-controls">
                    <button class="btn-ctrl" id="play-btn" onclick="togglePlay()">PAUSE</button>
                    <button class="btn-ctrl" id="mute-btn" onclick="toggleMute()">MUTE</button>
                    <span class="time-display" id="time-display">0:00 / 0:00</span>
                </div>
                <a href="/" class="btn-ctrl">/exit</a>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('main-video');

        function enterExperience() {
            document.getElementById('splash').classList.add('hidden');
            video.play();
            startProgressLoop();
        }

        function togglePlay() {
            if (video.paused) {
                video.play();
                document.getElementById('play-btn').textContent = 'PAUSE';
            } else {
                video.pause();
                document.getElementById('play-btn').textContent = 'PLAY';
            }
        }

        function toggleMute() {
            video.muted = !video.muted;
            document.getElementById('mute-btn').textContent = video.muted ? 'UNMUTE' : 'MUTE';
        }

        function seekVideo(e) {
            const container = document.getElementById('progress-container');
            const rect = container.getBoundingClientRect();
            const percentage = (e.clientX - rect.left) / rect.width;
            if (video.duration) {
                video.currentTime = video.duration * percentage;
            }
        }

        function startProgressLoop() {
            setInterval(() => {
                if (video.duration) {
                    const pct = (video.currentTime / video.duration) * 100;
                    document.getElementById('progress-bar').style.width = pct + '%';
                    document.getElementById('time-display').textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
                }
            }, 200);
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });
    </script>
</body>
</html>
