<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ænema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Rubik Font & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg-main: #050507;
            --accent: #00a6d8;
            --accent-dim: rgba(0, 166, 216, 0.2);
            --border: #2a2228;
            --text-main: #d4ceb8;
            --text-dim: #8a8578;
            --font-rubik: 'Rubik', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-rubik);
            overflow: hidden;
            user-select: none;
        }

        /* Fullscreen Viewport Container */
        .player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #main-video {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        /* Click to enter splash */
        #splash {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        #splash.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .splash-sub {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dim);
            letter-spacing: 1px;
            border: 1px solid var(--border);
            padding: 8px 18px;
            background: #0d0d11;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 4px;
        }

        .splash-sub:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Material Symbols Styling */
        .material-symbols-rounded {
            font-size: 18px;
            vertical-align: middle;
        }

        /* Controls */
        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: linear-gradient(transparent, rgba(5, 5, 7, 0.95));
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .player-container:hover .controls-overlay {
            opacity: 1;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: var(--border);
            cursor: pointer;
            position: relative;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }

        .left-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-ctrl {
            background: #0d0d11;
            border: 1px solid var(--border);
            color: var(--text-main);
            font-family: var(--font-rubik);
            font-size: 12px;
            font-weight: 500;
            padding: 6px 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 4px;
        }

        .btn-ctrl:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        .time-display {
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 400;
            margin-left: 6px;
        }

        .watermark {
            position: absolute;
            top: 20px;
            left: 24px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 1px;
            pointer-events: none;
            opacity: 0.5;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="splash" onclick="enterExperience()">
        <div class="splash-title"></div>
        <div class="splash-sub">
            <span class="material-symbols-rounded">play_arrow</span>
        </div>
    </div>

    <div class="player-container">
        <video id="main-video" crossorigin="anonymous" playsinline preload="auto">
            <source src="https://technoz3n.is-a.dev/mp4/aenema.webm" type="video/webm">
        </video>

        <div class="controls-overlay">
            <div class="progress-bar-container" id="progress-container" onclick="seekVideo(event)">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="control-row">
                <div class="left-controls">
                    <button class="btn-ctrl" id="play-btn" onclick="togglePlay()">
                        <span class="material-symbols-rounded" id="play-icon">pause</span>
                        <span id="play-text">pause</span>
                    </button>
                    <button class="btn-ctrl" id="mute-btn" onclick="toggleMute()">
                        <span class="material-symbols-rounded" id="mute-icon">volume_up</span>
                        <span id="mute-text">mute</span>
                    </button>
                    <span class="time-display" id="time-display">0:00 / 0:00</span>
                </div>
                <a href="/" class="btn-ctrl">
                    <span class="material-symbols-rounded">logout</span>
                    <span>exit</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('main-video');

        async function enterExperience() {
            document.getElementById('splash').classList.add('hidden');
            
            try {
                await video.play();
                updatePlayState(true);
            } catch (err) {
                console.log('unmuted play blocked, falling back to muted play:', err);
                video.muted = true;
                updateMuteState(true);
                await video.play();
                updatePlayState(true);
            }
            
            startProgressLoop();
        }

        function togglePlay() {
            if (video.paused) {
                video.play();
                updatePlayState(true);
            } else {
                video.pause();
                updatePlayState(false);
            }
        }

        function updatePlayState(isPlaying) {
            document.getElementById('play-icon').textContent = isPlaying ? 'pause' : 'play_arrow';
            document.getElementById('play-text').textContent = isPlaying ? 'pause' : 'play';
        }

        function toggleMute() {
            video.muted = !video.muted;
            updateMuteState(video.muted);
        }

        function updateMuteState(isMuted) {
            document.getElementById('mute-icon').textContent = isMuted ? 'volume_off' : 'volume_up';
            document.getElementById('mute-text').textContent = isMuted ? 'unmute' : 'mute';
        }

        function seekVideo(e) {
            const container = document.getElementById('progress-container');
            const rect = container.getBoundingClientRect();
            const percentage = (e.clientX - rect.left) / rect.width;
            if (video.duration) {
                video.currentTime = video.duration * percentage;
            }
        }

        function startProgressLoop() {
            setInterval(() => {
                if (video.duration) {
                    const pct = (video.currentTime / video.duration) * 100;
                    document.getElementById('progress-bar').style.width = pct + '%';
                    document.getElementById('time-display').textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
                }
            }, 200);
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });
    </script>
</body>
</html>
